# Central path configuration. Only the raw-data roots are machine-specific; edit
# these to point at wherever the (gitignored) raw MS data lives on your machine.
# Everything under repo_* is relative to this repository and portable.

# --- external / raw data (NOT in git; on Google Drive) --------------------------
raw:
  # Google Drive project roots
  calcurves_asms: "G:/My Drive/Lindsay Pino/proj/2025_calcurves_asms"
  bruker_ultra:   "G:/My Drive/Lindsay Pino/proj/2023_bruker_ultra"

  # raw curve inputs used by the example-curve figures (need re-fitting)
  exploris_elib: "${calcurves_asms}/data/Exhausted_CD8_DimethylBackground_DIA_Exploris480/calcurve2_KBB.elib.peptides.txt"
  il15_elib:     "${calcurves_asms}/data/IL15_IL2_stimulated_CD8_Curves/50perCycle_Quant.elib.peptides.txt"
  ultra_curves_pep:   "${bruker_ultra}/data/250320_Timbaux_Ultra_HumanYeast_22min/Timbaux_Ultrai_60spd/Timbaux_60SPD_DDM_CURVES_pep.tsv"
  ultraII_curves_pep: "${bruker_ultra}/data/250320_Desnaux_UltraII_HumanYeast_22min/UltraII_60spd_100ng_CURVES_pep.tsv"
  # Fig 3 retention-time / m/z / abundance needs the full DIA-NN report
  ultra_diann_report: "${bruker_ultra}/data/asms/ultra/diann_report.tsv"

# --- the LOD/LOQ/ULOQ tool (pinned submodule) -----------------------------------
tool:
  calculate_loq: "tools/matrix-matched_calcurves/bin/calculate-loq.py"

# --- repo-local, committed artifacts -------------------------------------------
fom:
  main:   "data/figuresofmerit/main"
  mnp0:   "data/figuresofmerit/supp_mnp0"
  legacy: "data/figuresofmerit/legacy_mnp2"
maps:   "data/maps"
output: "output"

